name: release-firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v (for example 0.2.0)"
        required: true
        type: string
      publish:
        description: "Create a GitHub Release with the built assets"
        required: false
        type: boolean
        default: false

# Read-only by default; the release job elevates to contents: write itself.
permissions:
  contents: read

concurrency:
  group: release-firmware-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORMIO_CORE_DIR: ${{ github.workspace }}/.platformio

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve version and tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
          elif [ "${REF#refs/tags/v}" != "$REF" ]; then
            version="${REF_NAME#v}"
          else
            version="0.0.0-dev+$(printf '%s' "$SHORT_SHA" | cut -c1-7)"
          fi
          if [ -z "$version" ]; then
            echo "error: empty version" >&2
            exit 1
          fi
          if [ "${REF#refs/tags/}" != "$REF" ]; then
            tag="${REF_NAME}"
          else
            tag="v${version}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "resolved version=$version tag=$tag"

  native-tests:
    name: Native unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ${{ env.PLATFORMIO_CORE_DIR }}
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --disable-pip-version-check --upgrade platformio

      - name: Run native tests
        run: pio test -e native

      - name: Run release script tests
        run: python -m unittest discover -s tests/python

  firmware:
    name: Build ${{ matrix.variant }} firmware
    runs-on: ubuntu-latest
    needs: [version, native-tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: esp32dev_station
            variant: station
            artifact: firmware-station
          - env: esp32dev_tester
            variant: tester
            artifact: firmware-tester
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ${{ env.PLATFORMIO_CORE_DIR }}
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --disable-pip-version-check --upgrade platformio

      - name: Build firmware
        env:
          FW_VERSION: ${{ needs.version.outputs.version }}
        run: pio run -e "${{ matrix.env }}"

      - name: Build release binaries
        env:
          FW_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          python scripts/build_release_bins.py \
            --build-dir ".pio/build/${{ matrix.env }}" \
            --output-dir "dist/${{ matrix.variant }}" \
            --version "$FW_VERSION" \
            --variant "${{ matrix.variant }}" \
            --print-manifest

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.variant }}/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [version, firmware]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: dist
          merge-multiple: true

      - name: Show assets
        run: |
          set -eu
          ls -l dist
          sha256sum dist/*.bin
          for name in \
            esp32-devkitc-station-merged.bin \
            esp32-devkitc-station-app.bin \
            esp32-devkitc-tester-merged.bin \
            esp32-devkitc-tester-app.bin \
            flash-manifest.json \
            flash-manifest-tester.json; do
            if [ ! -f "dist/$name" ]; then
              echo "error: missing release asset $name" >&2
              exit 1
            fi
          done

      - name: Check the tag points at the built commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -eu
          manifest_commit=$(python -c 'import json; print(json.load(open("dist/flash-manifest.json"))["build"]["gitCommit"] or "")')
          if [ -z "$manifest_commit" ]; then
            echo "error: flash-manifest.json has no build.gitCommit" >&2
            exit 1
          fi

          # Resolve the tag through the tag namespace (a branch with the same
          # name must not match) and peel annotated tags, including nested
          # tag -> tag chains, down to the commit. Only a real 404 means the tag
          # has not been created yet; any other failure aborts the publish.
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          status=$(curl -sS -o /tmp/tag-ref.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api/git/ref/tags/$TAG")

          tag_commit=""
          case "$status" in
            404)
              echo "tag $TAG does not exist yet"
              ;;
            200)
              sha=$(python -c 'import json; print(json.load(open("/tmp/tag-ref.json"))["object"]["sha"])')
              kind=$(python -c 'import json; print(json.load(open("/tmp/tag-ref.json"))["object"]["type"])')
              while [ "$kind" = "tag" ]; do
                if ! curl -sS -f -o /tmp/tag-object.json \
                    -H "Authorization: Bearer $GH_TOKEN" "$api/git/tags/$sha"; then
                  echo "error: cannot peel tag object $sha of $TAG" >&2
                  exit 1
                fi
                sha=$(python -c 'import json; print(json.load(open("/tmp/tag-object.json"))["object"]["sha"])')
                kind=$(python -c 'import json; print(json.load(open("/tmp/tag-object.json"))["object"]["type"])')
              done
              if [ "$kind" != "commit" ]; then
                echo "error: tag $TAG points at a $kind, not a commit" >&2
                exit 1
              fi
              tag_commit="$sha"
              ;;
            *)
              echo "error: cannot resolve tag $TAG (HTTP $status)" >&2
              exit 1
              ;;
          esac

          if [ -n "$tag_commit" ] && [ "$tag_commit" != "$manifest_commit" ]; then
            echo "error: tag $TAG points at $tag_commit but the assets were built from $manifest_commit" >&2
            exit 1
          fi
          echo "manifest commit: $manifest_commit"
          echo "tag commit: ${tag_commit:-<not created yet>}"

      - name: Create the tag for a manual publish
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -eu
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "tag $TAG already exists"
            exit 0
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$TAG" \
            -f "sha=$GITHUB_SHA" > /dev/null
          echo "created tag $TAG at $GITHUB_SHA"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          cat > release-notes.md <<'EOF'
          ## ファームウェア（2種類）

          | ファイル | 用途 |
          | --- | --- |
          | `esp32-devkitc-station-merged.bin` | 🎛️ 環境ステーション本体（`0x0000` から書き込み） |
          | `esp32-devkitc-station-app.bin` | station のアプリ単体（`0x10000`） |
          | `flash-manifest.json` | station のマニフェスト（アプリが自動で読む既定のファイル） |
          | `esp32-devkitc-tester-merged.bin` | 🧪 パーツ動作確認テスト（`0x0000` から書き込み） |
          | `esp32-devkitc-tester-app.bin` | tester のアプリ単体（`0x10000`） |
          | `flash-manifest-tester.json` | tester のマニフェスト |

          書き込みは [esp32-devkitc-flasher](https://github.com/yuushi-labs/esp32-devkitc-flasher) の Release 選択から。まず `tester` で I2C・センサー・ボタンの配線を確認し、そのあと `station` を書き込むのがおすすめです。

          ### 🎛️ station
          - OLED に温度・気圧・湿度・記録状態を表示（エンコーダで4ページ切替）
          - `CON` 短押しで手動記録、長押しで記録 ON/OFF、`PSH` で間隔切替（10秒/1分/5分）
          - LittleFS の `/log.csv` に `uptime_ms,temp_c,pressure_hpa,humidity_pct` を追記（flasher の LittleFS 吸い出しで読み出し可能）

          ### 🧪 tester
          - 起動時と5秒ごとに I2C 全アドレスをスキャンして OLED / BMP280 を判定
          - BMP280 の温度・気圧、DHT11/DHT22 の湿度・温度を表示
          - エンコーダ位置と PSH / BAK / CON の押下をリアルタイム表示
          - シリアルコマンド: `SCAN` / `SENSORS` / `INPUTS`
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "esp32-devkitc-firmware v$VERSION" \
              --notes-file release-notes.md
          fi
