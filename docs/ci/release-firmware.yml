name: release-firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v (for example 0.3.0)"
        required: true
        type: string
      publish:
        description: "Create a GitHub Release with the built assets"
        required: false
        type: boolean
        default: false

# Read-only by default; the release job elevates to contents: write itself.
permissions:
  contents: read

concurrency:
  group: release-firmware-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORMIO_CORE_DIR: ${{ github.workspace }}/.platformio

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve version and tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
          elif [ "${REF#refs/tags/v}" != "$REF" ]; then
            version="${REF_NAME#v}"
          else
            version="0.0.0-dev+$(printf '%s' "$SHORT_SHA" | cut -c1-7)"
          fi
          if [ -z "$version" ]; then
            echo "error: empty version" >&2
            exit 1
          fi
          if [ "${REF#refs/tags/}" != "$REF" ]; then
            tag="${REF_NAME}"
          else
            tag="v${version}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "resolved version=$version tag=$tag"

  native-tests:
    name: Native unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ${{ env.PLATFORMIO_CORE_DIR }}
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --disable-pip-version-check --upgrade platformio

      - name: Run native tests
        run: pio test -e native

      - name: Run release script tests
        run: python -m unittest discover -s tests/python

  firmware:
    name: Build ${{ matrix.variant }} firmware
    runs-on: ubuntu-latest
    needs: [version, native-tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: esp32dev_station
            variant: station
            artifact: firmware-station
          - env: esp32dev_tester
            variant: tester
            artifact: firmware-tester
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ${{ env.PLATFORMIO_CORE_DIR }}
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --disable-pip-version-check --upgrade platformio

      - name: Build firmware
        env:
          FW_VERSION: ${{ needs.version.outputs.version }}
        run: pio run -e "${{ matrix.env }}"

      - name: Build release binaries
        env:
          FW_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          python scripts/build_release_bins.py \
            --build-dir ".pio/build/${{ matrix.env }}" \
            --output-dir "dist/${{ matrix.variant }}" \
            --version "$FW_VERSION" \
            --variant "${{ matrix.variant }}" \
            --print-manifest

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.variant }}/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [version, firmware]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: dist
          merge-multiple: true

      - name: Show assets
        run: |
          set -eu
          ls -l dist
          sha256sum dist/*.bin
          for name in \
            esp32-devkitc-station-merged.bin \
            esp32-devkitc-station-app.bin \
            esp32-devkitc-tester-merged.bin \
            esp32-devkitc-tester-app.bin \
            flash-manifest.json \
            tester-flash-manifest.json; do
            if [ ! -f "dist/$name" ]; then
              echo "error: missing release asset $name" >&2
              exit 1
            fi
          done

      - name: Check the tag points at the built commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -eu
          manifest_commit=$(python -c 'import json; print(json.load(open("dist/flash-manifest.json"))["build"]["gitCommit"] or "")')
          if [ -z "$manifest_commit" ]; then
            echo "error: flash-manifest.json has no build.gitCommit" >&2
            exit 1
          fi

          # Resolve the tag through the tag namespace (a branch with the same
          # name must not match) and peel annotated tags, including nested
          # tag -> tag chains, down to the commit. Only a real 404 means the tag
          # has not been created yet; any other failure aborts the publish.
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          status=$(curl -sS -o /tmp/tag-ref.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api/git/ref/tags/$TAG")

          tag_commit=""
          case "$status" in
            404)
              echo "tag $TAG does not exist yet"
              ;;
            200)
              sha=$(python -c 'import json; print(json.load(open("/tmp/tag-ref.json"))["object"]["sha"])')
              kind=$(python -c 'import json; print(json.load(open("/tmp/tag-ref.json"))["object"]["type"])')
              while [ "$kind" = "tag" ]; do
                if ! curl -sS -f -o /tmp/tag-object.json \
                    -H "Authorization: Bearer $GH_TOKEN" "$api/git/tags/$sha"; then
                  echo "error: cannot peel tag object $sha of $TAG" >&2
                  exit 1
                fi
                sha=$(python -c 'import json; print(json.load(open("/tmp/tag-object.json"))["object"]["sha"])')
                kind=$(python -c 'import json; print(json.load(open("/tmp/tag-object.json"))["object"]["type"])')
              done
              if [ "$kind" != "commit" ]; then
                echo "error: tag $TAG points at a $kind, not a commit" >&2
                exit 1
              fi
              tag_commit="$sha"
              ;;
            *)
              echo "error: cannot resolve tag $TAG (HTTP $status)" >&2
              exit 1
              ;;
          esac

          if [ -n "$tag_commit" ] && [ "$tag_commit" != "$manifest_commit" ]; then
            echo "error: tag $TAG points at $tag_commit but the assets were built from $manifest_commit" >&2
            exit 1
          fi
          echo "manifest commit: $manifest_commit"
          echo "tag commit: ${tag_commit:-<not created yet>}"

      - name: Create the tag for a manual publish
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -eu
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "tag $TAG already exists"
            exit 0
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$TAG" \
            -f "sha=$GITHUB_SHA" > /dev/null
          echo "created tag $TAG at $GITHUB_SHA"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          cat > release-notes.md <<'EOF'
          ## ファームウェア（2種類）

          | ファイル | 用途 |
          | --- | --- |
          | `esp32-devkitc-station-merged.bin` | 🎛️ 多機能環境ステーション本体（`0x0000` から書き込み） |
          | `esp32-devkitc-station-app.bin` | station のアプリ単体（`0x10000`） |
          | `flash-manifest.json` | station のマニフェスト（アプリが自動で読む既定のファイル） |
          | `esp32-devkitc-tester-merged.bin` | 🧪 パーツ動作確認テスト（`0x0000` から書き込み） |
          | `esp32-devkitc-tester-app.bin` | tester のアプリ単体（`0x10000`） |
          | `tester-flash-manifest.json` | tester のマニフェスト |

          書き込みは [esp32-devkitc-flasher](https://github.com/yuushi-labs/esp32-devkitc-flasher) の Release 選択から。配線（`pins.json`、10 ピン）は **v0.2.0 から変更ありません**。はじめてなら、まず `tester` で I2C・センサー・ボタンの配線を確認し、そのあと `station` を書き込むのがおすすめです。

          ## 🎛️ station — v0.3.0 の新機能

          6 モードの OLED UI です。エンコーダで項目を選び、`CON` / `PSH` で入り、`BAK` 長押しでホームへ戻ります。

          | # | モード | できること |
          | --- | --- | --- |
          | 1 | 📊 環境モニター | 温度（BMP280 → DHT フォールバック）・湿度・気圧・不快指数・天気傾向。エンコーダでサマリー／ミニグラフ／詳細を切替。高温・乾燥・気圧急変で OLED と LED が知らせます |
          | 2 | 📁 ログ（LittleFS） | NTP 時刻付き CSV を `/log.csv` に記録。`PSH` で 10 秒／1 分／5 分、`CON` 短押しで手動 1 件、長押しで記録 ON/OFF |
          | 3 | 🌐 Wi-Fi ＆ Web | 初回は AP 設定モード。接続後は `http://<IP>/` のダッシュボードと JSON API、`CON` で OLED に QR コード |
          | 4 | 📶 Bluetooth | センサー値の GATT 配信＋ HID メディアリモコン（音量・再生/停止・曲送り） |
          | 5 | ⏱️ タイマー | 1〜60 分のカウントダウンとポモドーロ（25 分/5 分） |
          | 6 | 🛠️ システム | IP / RSSI、BLE 状態、I2C スキャン、LittleFS 容量、Wi-Fi 設定の初期化 |

          ### はじめての Wi-Fi 設定
          1. 未設定で起動すると `ESP32-Station-AP` が立ち上がります。スマホで接続してください。
          2. **AP は WPA2 で保護されていて、パスワードは起動ごとに変わります。** OLED の Wi-Fi 画面に出ている `pass xxxxxxxx` の 8 文字を入力します。
          3. `http://192.168.4.1/` のフォームに周辺 SSID が並ぶので、選んでパスワードを保存します。保存後は自動でそのネットワークへ切り替わります。
          4. 設定をやり直したいときは、Wi-Fi 画面で `PSH`（または `wifi ap`）を押すと AP 設定モードへ戻ります。もう一度 `PSH` で保存済みネットワークへ戻ります。

          ### Web ダッシュボード
          - `http://<IP>/`: 温湿度・気圧・不快指数を 2 秒ごとに更新、履歴グラフ、`/log.csv` ダウンロード、ログ消去、OLED への QR 表示
          - `GET /api/status`: 現在値と Wi-Fi / BLE / ログ / タイマー状態（Raspberry Pi などからも）
          - `GET /api/logs`: 直近 120 件の履歴 JSON
          - 外部 CDN は使いません（インターネットにつながっていない LAN でも動きます）

          ### ログとパーティション
          - `/log.csv` のヘッダーは `timestamp,uptime_ms,temp_c,pressure_hpa,humidity_pct`（NTP 未同期のときは時刻欄が空欄）
          - v0.2.0 の 4 列ログが残っているボードでは、起動時に `/log-v020.csv` へ退避してから新しい 5 列ファイルを始めます（既に退避ファイルがあるときは `/log-v020-2.csv` 〜 `/log-v020-9.csv` の空き番号を使い、過去のログを上書きしません。すべて埋まっている場合は旧ファイルをそのまま残して記録を停止します）
          - パーティションは `no_ota.csv`（app 2 MB ＋ LittleFS 1.9 MB）。マニフェストの `filesystems` も同じ値（`0x210000` / 1,966,080 B）で、flasher の吸い出しでログをそのまま取り出せます

          ### BLE
          - デバイス名 `ESP32-EnvStation`。Environmental Sensing（`0x181A`）相当の温度・湿度・気圧と状態通知
          - メディアリモコン: エンコーダ → 音量、`PSH` → 再生/停止、`CON` → 次の曲、`BAK` → 前の曲（`BAK` 長押しでメニュー）

          ### シリアルコマンド（115200 bps）
          `help` / `ping` / `info` / `scan` / `sensors` / `log [on|off|now|clear]` / `page [1..6]` / `mode [env|logs|wifi|ble|timer|system|menu]` / `wifi [status|ap|station|clear]` / `ble [status|hid on|hid off]` / `timer [N|start|pause|reset]` / `led [on|off|blink]`

          ## 🧪 tester
          v0.2.0 のままです（I2C 全スキャン、BMP280 / DHT の応答、エンコーダとボタンの導通、`scan` / `sensors` / `inputs`）。

          ## 検証
          - `pio test -e native`（ホスト単体テスト）と `python3 -m unittest discover -s tests/python`、station / tester の両ビルドが GitHub Actions で成功
          - アセットはタグのコミットからビルドされ、マニフェストの `build.gitCommit` がタグのコミットと一致していることを確認済み
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "esp32-devkitc-firmware v$VERSION" \
              --notes-file release-notes.md
          fi
