; PlatformIO project for ESP32-DevKitC (esp32dev)
; Firmware: esp32-devkitc-firmware
; Docs: README.md / SPEC.md
;
; Two hardware targets share one code base:
;   env:esp32dev_station  multi-function station (OLED + BMP280 + DHT + encoder
;                         + buttons + LittleFS/NTP log + Wi-Fi dashboard + BLE)
;   env:esp32dev_tester   parts check firmware (I2C scan, sensor presence,
;                         encoder/button continuity)
;   env:native            host unit tests, no Arduino dependencies
;
; The firmware version is compiled in from src/app_config.h. Release builds
; override it with an extra flag, e.g.
;   PLATFORMIO_BUILD_FLAGS='-DFW_VERSION=\"0.3.0\"' pio run -e esp32dev_station

[platformio]
default_envs = esp32dev_station, esp32dev_tester
description = ESP32-DevKitC environment station and parts tester firmware

[common]
build_flags =
    -Wall
    -Wextra
    -Isrc

[esp32_common]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino

monitor_speed = 115200

board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.f_cpu = 240000000L
; Wi-Fi + BLE firmware needs the 2 MB app slot from no_ota.csv; the LittleFS
; data partition stays large enough to keep /log.csv readable by the flasher.
board_build.partitions = no_ota.csv
board_upload.flash_size = 4MB

; NimBLE keeps the BLE stack far smaller than the default Bluedroid build.
lib_deps =
    h2zero/NimBLE-Arduino@^2.5.2

build_flags =
    ${common.build_flags}
    -DCORE_DEBUG_LEVEL=0
    -DFW_BOARD=\"esp32dev\"

; FW_VERSION=<version> pio run -e esp32dev_station  embeds a release version.
; pins.json is rendered into pinout_generated.h by scripts/pio_pinout_header.py
; (override the path with PINS_JSON=/path/to/pins.json).
extra_scripts =
    pre:scripts/pio_fw_version.py
    pre:scripts/pio_pinout_header.py

[env:esp32dev_station]
extends = esp32_common
build_flags =
    ${esp32_common.build_flags}
    -DFW_TARGET_STATION=1
[env:esp32dev_tester]
extends = esp32_common
build_flags =
    ${esp32_common.build_flags}
    -DFW_TARGET_TESTER=1

[env:native]
platform = native
build_flags =
    ${common.build_flags}
    -std=gnu++17
    -O2
    -DUNIT_TEST
test_build_src = true
; Only the Arduino dependent glue is left out of the host tests; every driver,
; formatter and state machine in src/ is compiled and tested.
build_src_filter =
    +<*>
    -<main.cpp>
    -<hal>
    -<station/station_app.cpp>
    -<tester/tester_app.cpp>
extra_scripts = pre:scripts/pio_pinout_header.py
