; PlatformIO project for ESP32-DevKitC (esp32dev)
; Firmware: esp32-devkitc-firmware
; Docs: README.md / SPEC.md
;
; The firmware version is compiled in from src/app_config.h. Release builds
; override it with an extra flag, e.g.
;   PLATFORMIO_BUILD_FLAGS='-DFW_VERSION="0.2.0"' pio run -e esp32dev

[platformio]
default_envs = esp32dev
description = ESP32-DevKitC firmware with serial command interface

[common]
build_flags =
    -Wall
    -Wextra

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino

monitor_speed = 115200

board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.f_cpu = 240000000L
board_build.partitions = default.csv
board_upload.flash_size = 4MB

build_flags =
    ${common.build_flags}
    -DCORE_DEBUG_LEVEL=0
    -DFW_BOARD=\"esp32dev\"

; FW_VERSION=<version> pio run -e esp32dev  embeds a release version
; pins.json is rendered into pinout_generated.h by scripts/pio_pinout_header.py
; (override the path with PINS_JSON=/path/to/pins.json).
extra_scripts =
    pre:scripts/pio_fw_version.py
    pre:scripts/pio_pinout_header.py

[env:native]
platform = native
build_flags =
    ${common.build_flags}
    -std=gnu++17
    -O2
    -DUNIT_TEST
test_build_src = true
build_src_filter = +<*> -<main.cpp>
extra_scripts = pre:scripts/pio_pinout_header.py
